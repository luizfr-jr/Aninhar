# Optional reverse proxy for the Node application. The Docker image runs Node
# directly on port 80 and does not load this file. Point an external Nginx
# upstream at the host port configured in Compose (8090 in docker/).
server {
    listen 80;
    server_name _;
    client_max_body_size 9m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
